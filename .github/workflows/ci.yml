name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker build -t sun-video-editor-dev .
      - name: Download release dependencies, test, and package
        # The runner UID has no writable home in the image; keep GTK data and caches in the workspace.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v /etc/passwd:/etc/passwd:ro
          -v /etc/group:/etc/group:ro
          -e XDG_DATA_HOME=/workspaces/sun_video_editor/tmp/ci/data
          -e XDG_CACHE_HOME=/workspaces/sun_video_editor/tmp/ci/cache
          -e XDG_CONFIG_HOME=/workspaces/sun_video_editor/tmp/ci/config
          -v "$PWD:/workspaces/sun_video_editor" sun-video-editor-dev
          bash -o pipefail -c 'mkdir -p build "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" &&
          { ./scripts/install-dependencies.sh && ./build.sh --package; } 2>&1 | tee build/package-tests.log'
      - name: Archive tested Snap payload
        run: tar -C build/editor-package/root -czf build/snap-payload.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun-video-editor-amd64
          path: |
            build/*.deb
            build/sun-version.txt
            build/package-tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: snap-payload
          if-no-files-found: error
          path: build/snap-payload.tar.gz
  publish-dev:
    needs: editor
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-video-editor-amd64
          path: build/release
      - name: Move dev tag to the tested commit
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/dev';
            try {
              await github.rest.git.updateRef({...context.repo, ref, sha: context.sha, force: true});
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({...context.repo, ref: `refs/${ref}`, sha: context.sha});
            }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development Build
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            build/release/*.deb
            build/release/sun-version.txt
          body: |
            Latest tested development build from main.

            Commit: ${{ github.sha }}

            Debian package for amd64, built on Ubuntu 26.04; requires FFmpeg 8+.
            Snap builds are published separately to the Snap Store edge channel
            when Store credentials are configured.
  snap:
    needs: editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: snap-payload
          path: build
      - name: Restore tested payload with executable permissions
        run: |
          mkdir -p build/editor-package/root
          tar -xzf build/snap-payload.tar.gz -C build/editor-package/root
      - name: Build Snap
        id: snapcraft
        uses: canonical/action-build@v1
      - uses: actions/upload-artifact@v4
        with:
          name: sun-video-editor-snap-amd64
          if-no-files-found: error
          path: ${{ steps.snapcraft.outputs.snap }}
  publish-snap:
    needs: snap
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-video-editor-snap-amd64
          path: build/release
      - name: Locate built Snap
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          packages=(build/release/*.snap)
          test "${#packages[@]}" -eq 1
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish to Snap Store edge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: canonical/action-publish@v1
        with:
          snap: ${{ steps.package.outputs.path }}
          release: edge
      - name: Explain missing Store setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo 'Snap built but not published. Register sun-video-editor and add the SNAPCRAFT_STORE_CREDENTIALS repository secret; see README.md.' >> "$GITHUB_STEP_SUMMARY"
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Apple Silicon toolchain and media dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install namo-robotics/sun/sun namo-robotics/sun/sun-gtk4 librsvg gstreamer ffmpeg coreutils cmake ninja pkgconf gobject-introspection
      - name: Select GTK with media playback
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix sun-gtk4)/lib/pkgconfig:$(brew --prefix libffi)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SUN_GTK_PREFIX=$(brew --prefix sun-gtk4)" >> "$GITHUB_ENV"
      - name: Download published dependency bundles
        run: ./scripts/install-dependencies.sh
      - name: Build, test, and package the editor
        env:
          # The hosted display cannot accommodate the 1200px resize target.
          SUN_EDITOR_TEST_RESIZE: '0'
        run: ./scripts/package-macos.sh
      - name: Render and test the Homebrew formula
        shell: bash
        run: |
          archive="build/sun-video-editor-${GITHUB_SHA}-arm64-apple-darwin.tar.gz"
          digest=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          version="0.1.0.dev.${GITHUB_RUN_NUMBER}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/$(basename "$archive")"
          sed -e "s|@URL@|$url|" -e "s|@VERSION@|$version|" -e "s|@SHA256@|$digest|" homebrew/sun-video-editor.rb.in > build/sun-video-editor.rb
          ruby -c build/sun-video-editor.rb
          # Install the exact tested archive through a local tap before publication.
          brew tap-new --no-git local/editor-test
          tap_dir="$(brew --repository)/Library/Taps/local/homebrew-editor-test"
          sed "s|$url|file://$PWD/$archive|" build/sun-video-editor.rb > "$tap_dir/Formula/sun-video-editor.rb"
          brew install --formula local/editor-test/sun-video-editor
          brew test local/editor-test/sun-video-editor
          cat build/sun-video-editor.rb
      - uses: actions/upload-artifact@v4
        with:
          name: sun-video-editor-macos-arm64
          if-no-files-found: error
          path: |
            build/*.tar.gz
            build/*.tar.gz.sha256
            build/sun-version.txt
            build/macos-linkage.txt
            build/sun-video-editor.rb
  publish-macos:
    needs: macos
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-video-editor-macos-arm64
          path: build/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development Build
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            build/release/*.tar.gz
            build/release/*.tar.gz.sha256
            build/release/sun-video-editor.rb
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Add TAP_TOKEN with contents write access to namo-robotics/homebrew-sun to update the tap automatically.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          repo=namo-robotics/homebrew-sun
          blob=$(gh api "repos/$repo/contents/Formula/sun-video-editor.rb" --jq .sha 2>/dev/null || true)
          args=()
          if [ -n "$blob" ]; then args+=(-f "sha=$blob"); fi
          gh api -X PUT "repos/$repo/contents/Formula/sun-video-editor.rb" \
            -f message='editor: update the tested Apple Silicon release' \
            -f "content=$(base64 -w0 build/release/sun-video-editor.rb)" "${args[@]}"
